<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信读书扫码登录测试</title>
<style>
    :root { color-scheme: dark; }
    body {
        margin: 0; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 32px 16px; box-sizing: border-box;
        background: #1e1e1e; color: #e6e6e6;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 16px; font-weight: 500; margin: 0; }
    .qr {
        width: 320px; height: 320px; background: #fff; border-radius: 12px; padding: 12px;
        box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    }
    .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
    .qr.empty::after { content: "等待生成二维码…"; color: #888; font-size: 13px; }
    .hint { font-size: 13px; line-height: 1.7; color: #a8a8a8; max-width: 420px; text-align: center; }
    .hint b { color: #e6e6e6; font-weight: 500; }
    .stale { color: #d8964a; }
    .fresh { color: #6fb98f; }
</style>
</head>
<body>
<h1>微信读书扫码登录测试</h1>

<div class="qr empty" id="box"><img id="img" alt="登录二维码"></div>

<div class="hint">
    请用<b>微信</b>扫描上方二维码。<br>
    二维码寿命约 <b>55 秒</b>，本页每 2 秒自动重载一次图片，<br>
    过期后会自动换成新码，<b>无需手动刷新页面</b>。<br>
    <span id="age" class="stale">等待二维码生成…</span>
</div>

<div class="hint" style="font-size:12px;opacity:.75">
    先运行 <b>npm run test:login</b>，再打开本页。<br>
    登录结果会写入项目根目录的 qr-result.json。
</div>

<script>
const QR = "qr-test.png";
    const img = document.getElementById("img");
    const box = document.getElementById("box");
    const age = document.getElementById("age");
    let lastSrc = "";
    let lastLoad = 0;

    img.addEventListener("load", () => {
        if (img.naturalWidth > 0) {
            box.classList.remove("empty");
            lastLoad = Date.now();
        }
    });
    img.addEventListener("error", () => box.classList.add("empty"));

    function tick() {
        // 加时间戳绕过缓存，实现自动刷新
        const src = QR + "?t=" + Date.now();
        if (src !== lastSrc) {
            lastSrc = src;
            img.src = src;
        }
        if (lastLoad) {
            const sec = Math.floor((Date.now() - lastLoad) / 1000);
            const left = Math.max(0, 55 - sec);
            age.textContent = left > 0
                ? "当前二维码约 " + left + " 秒后换新"
                : "二维码正在换新…";
            age.className = left > 12 ? "fresh" : "stale";
        }
    }

    tick();
    setInterval(tick, 2000);
</script>
</body>
</html>
